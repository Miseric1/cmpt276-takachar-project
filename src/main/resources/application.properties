spring.application.name=demo
spring.config.import=optional:file:./application-secrets.properties

# Supabase PostgreSQL is the default runtime database. Credentials are supplied
# through environment variables so secrets never live in the repository.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=TakacharHikariPool

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Keep lazy-loading behaviour consistent across every datasource profile.
# Service methods map entities to DTOs inside their own transaction, so the
# view layer never triggers lazy initialisation on its own.
spring.jpa.open-in-view=false

# Ticket triage/SLA targets and media uploads. Business days are Monday-Friday;
# production can override each priority deadline separately.
app.ticketing.sla-business-days.urgent=${TICKET_SLA_URGENT_BUSINESS_DAYS:1}
app.ticketing.sla-business-days.high=${TICKET_SLA_HIGH_BUSINESS_DAYS:2}
app.ticketing.sla-business-days.medium=${TICKET_SLA_MEDIUM_BUSINESS_DAYS:3}
app.ticketing.sla-business-days.low=${TICKET_SLA_LOW_BUSINESS_DAYS:5}
app.ticketing.default-spoc-email=${TICKET_DEFAULT_SPOC_EMAIL:}
app.ticketing.upload-dir=${TICKET_UPLOAD_DIR:./data/ticket-uploads}
app.ticketing.max-attachment-bytes=${TICKET_MAX_ATTACHMENT_BYTES:26214400}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=100MB

# Notification providers: log (default), resend, or smtp. A local ignored
# application-secrets.properties file can supply the Resend key without an
# environment variable and without exposing the key in Git.
app.notifications.provider=${EMAIL_PROVIDER:log}
app.notifications.resend.api-key=${RESEND_API_KEY:}
app.notifications.resend.base-url=${RESEND_BASE_URL:https://api.resend.com}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
app.notifications.from=${NOTIFICATION_FROM:Takachar Support <onboarding@resend.dev>}

# Hugging Face serverless text-classification. With no token, feedback is
# retained and marked NEUTRAL rather than making submission fail.
app.huggingface.token=${HF_TOKEN:}
app.huggingface.base-url=${HF_BASE_URL:https://router.huggingface.co/hf-inference/models}
app.huggingface.sentiment-model=${HF_SENTIMENT_MODEL:cardiffnlp/twitter-roberta-base-sentiment-latest}
app.huggingface.connect-timeout-seconds=${HF_CONNECT_TIMEOUT_SECONDS:5}
app.huggingface.read-timeout-seconds=${HF_READ_TIMEOUT_SECONDS:15}

# Pagination guardrails for every endpoint that accepts a Pageable.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false
