# Explicit local-development datasource. Normal application startup uses
# Supabase PostgreSQL; select this profile only when offline H2 development is
# desired: SPRING_PROFILES_ACTIVE=local.
spring.datasource.url=${LOCAL_DATASOURCE_URL:jdbc:h2:file:./data/supportsync}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${LOCAL_DATASOURCE_USERNAME:sa}
spring.datasource.password=${LOCAL_DATASOURCE_PASSWORD:}
spring.datasource.hikari.pool-name=TakacharLocalH2Pool

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
