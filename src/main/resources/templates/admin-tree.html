<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ | Takachar</title>

    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="admin-dashboard-body" data-faq-mode="admin" th:attr="data-admin-email=${email}">

<div class="admin-layout">

    <aside class="admin-sidebar">

        <div class="admin-brand admin-brand--logo">
            <img th:src="@{/images/takachar-logo.png}" alt="Takachar" class="admin-brand-image" />
        </div>

        <nav class="admin-nav">

            <a class="admin-nav-link" th:href="@{/admin/home}">
                <span class="admin-nav-icon">▦</span>
                Dashboard
            </a>

            <a class="admin-nav-link" th:href="@{/admin/feedback}">
                <span class="admin-nav-icon">▤</span>
                Feedback tracker
            </a>

            <a class="admin-nav-link admin-nav-link" th:href="@{/admin/faq}">
                <span class="admin-nav-icon">▣</span>
                FAQ &amp; knowledge base
            </a>

            <a class="admin-nav-link" th:href="@{/admin/tickets}">
                <span class="admin-nav-icon">▱</span>
                Support tickets
            </a>
            
            <a class="admin-nav-link admin-nav-link--active" th:href="@{/admin/tree}">
                <span class="admin-nav-icon">▱</span>
                Diagnostic Tree
            </a>
        </nav>

        <div class="admin-sidebar-bottom">
            <a class="admin-nav-link" th:href="@{/customer/home}">
                <span class="admin-nav-icon">⇆</span>
                View as customer
            </a>
        </div>

    </aside>

    <main class="admin-main">

        <header class="admin-header">

            <div>
                <p class="admin-header-label">Admin workspace</p>
                <h1>Diagnostic Tree</h1>
            </div>

            <div class="admin-profile">

                <div class="admin-profile-details">
                    <strong th:text="${email}">admin@example.com</strong>
                    <span>Administrator</span>
                </div>

                <form th:action="@{/logout}" method="post">

                    <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}"
                    >

                    <button type="submit" class="admin-logout-button">
                        Log out
                    </button>

                </form>

            </div>

        </header>

        
        <section class="admin-panel">
            <div class="admin-panel-header">
                <div>
                    <h2>Complaint Categories</h2>
                    <p>Manage complaint categories and diagnostic questions to identify customer issues.</p>
                    <!-- 
                        categories. 
                        then go to questions
                        then resoltuion. 
                    -->
                </div>
                
            </div>
        
        </section>

      

    </main>

</div>

<!-- Add / Edit Article modal -->
<div class="faq-modal-overlay" id="faqModalOverlay" hidden>
    <div class="faq-modal" role="dialog" aria-modal="true" aria-labelledby="faqModalTitle">
        <div class="faq-modal-header">
            <h3 id="faqModalTitle">Add Article</h3>
            <button type="button" class="faq-modal-close" id="faqModalClose" aria-label="Close">✕</button>
        </div>

        <form id="faqModalForm" class="faq-modal-form">
            <input type="hidden" id="faqFormId" value="" />

            <div class="form-group">
                <label for="faqFormTitle">Question</label>
                <input type="text" id="faqFormTitle" required maxlength="250" placeholder="e.g. How do I reset my password?" />
            </div>

            <div class="form-group">
                <label for="faqFormCategory">Category</label>
                <input type="text" id="faqFormCategory" list="faqCategoryOptions" required maxlength="100" placeholder="e.g. Account &amp; Access" />
                <datalist id="faqCategoryOptions"></datalist>
            </div>

            <div class="form-group">
                <label for="faqFormBody">Answer</label>
                <textarea id="faqFormBody" required rows="6" placeholder="Write the full answer customers will see..."></textarea>
            </div>

            <div class="faq-modal-error" id="faqModalError" hidden></div>

            <div class="faq-modal-actions">
                <button type="button" class="btn btn-danger btn-inline" id="faqFormDelete" hidden>Delete</button>
                <div class="faq-modal-actions-right">
                    <button type="button" class="btn btn-secondary btn-inline" id="faqFormCancel">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-inline" id="faqFormSave">Save</button>
                </div>
            </div>
        </form>
    </div>
</div>

<script th:src="@{/js/faq.js}"></script>

</body>
</html>
